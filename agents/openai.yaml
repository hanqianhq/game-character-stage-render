interface:
  display_name: "Game Character Stage Render"
  short_description: "Routes character references into refined 3D stage renders with 60% framing, area lighting and grounded shadows"
  default_prompt: "Use $game-character-stage-render. Classify the reference as stylized/anime, concept art, or realistic game/3D; choose the matching 3D finish while preserving identity and equipment. Unless the user specifies another size, frame the complete silhouette at about 60% of canvas height. Light it with invisible off-frame area lights, subtle diffuse ambient glow, selective contour separation, and soft contact plus cast shadows; keep the floor matte and non-reflective."
