interface:
  display_name: "Game Character Stage Render"
  short_description: "Creates dimensional 3D character renders with material-specific PBR, cinematic dark-stage lighting and 60% framing"
  default_prompt: "Use $game-character-stage-render. Classify the reference as stylized/anime, concept art, or realistic game/3D; choose the matching 3D finish while preserving identity and equipment. For anime characters, preserve the design while rebuilding visible 3D volume; avoid flat illustration, line art and cel shading, and keep the dark stage floor clear of fog or smoke. Use material-specific PBR response: distinguish metal from paint/enamel, leather, cloth and skin through roughness and reflections; add restrained skin subsurface scattering, and avoid making every surface glossy. Unless the user specifies another size, frame the complete silhouette at about 60% of canvas height. Light it with invisible off-frame area lights, selective contour separation, and soft contact plus cast shadows; keep the floor matte and non-reflective."
